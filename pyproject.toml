[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-agents"
version = "0.1.0"
description = "Experimental runtime for specialized forecasting agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
# Only for scripts/crsp_data.py fetch. wrds pins pandas<2.3, so use Python 3.11-3.13.
wrds = ["wrds>=3.1,<4"]

[project.scripts]
forecast-agents = "forecast_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
