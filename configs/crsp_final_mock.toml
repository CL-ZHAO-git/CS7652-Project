# FINAL window, 2015-2024, with scripted mock agents. Reserved for the final
# experiments: do not run real agents on this window or look at agent results
# for it until prompts and settings are frozen on the development window.
# Build the panel first: configs/datasets/crsp_lc30_2015_2024.toml
mode = "multi"
max_revisions = 1

[data]
source = "json"
path = "data/panels/crsp_lc30_2015_2024.json"
# 70/30 walk-forward: validation folds 2018, 2019, 2020, 2021 (each trained on all
# earlier data); test 2022-2024, refitted each January on all data to date.
train_end = "2017-12-31"       # fold 1 trains on 2015-2017; resolves to 2017-12-29
validation_end = "2021-12-31"  # end of the agents' data
refit = "year"
validation_stride = 5          # score every 5th trading day in validation folds
test_stride = 1                # score every test day
horizons = [1, 3, 5]

[llm]
backend = "mock"
max_output_tokens = 4096

[execution]
# Only trusted scripted fixtures use this mode. It is NOT a security sandbox.
mode = "local"
timeout_seconds = 120
evaluation_wall_seconds = 3600

[budget]
max_llm_calls = 80
max_total_tokens = 100000
max_tool_calls = 150
wall_seconds = 3600
