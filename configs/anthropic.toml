mode = "multi"
max_revisions = 1

[data]
source = "synthetic"
stocks = 4
sessions = 120
train_sessions = 70
validation_sessions = 25
horizons = [1, 3, 5]

[llm]
backend = "anthropic"
model = "${LLM_MODEL}"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
max_output_tokens = 4096

[execution]
mode = "docker"
image = "python:3.13-slim"
cpus = 1.0
memory_mb = 1024
timeout_seconds = 30
evaluation_wall_seconds = 300

[budget]
max_llm_calls = 80
max_total_tokens = 100000
max_tool_calls = 150
wall_seconds = 1200
