# Initial integration uses synthetic data. No CRSP files are passed to the API.
mode = "multi"
max_revisions = 1

[data]
source = "synthetic"
stocks = 4
sessions = 120
seed = 7
train_sessions = 70
validation_sessions = 25
horizons = [1, 3, 5]

[llm]
backend = "openai_compatible"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
token_parameter = "max_tokens"
max_output_tokens = 4096
max_context_chars = 32000
timeout_seconds = 60

[llm.request_options]
# Explicit mode for a bounded initial test; part of the recorded experiment config.
thinking = { type = "disabled" }

[execution]
mode = "docker"
image = "python:3.13-slim"
cpus = 1.0
memory_mb = 1024
timeout_seconds = 30
evaluation_wall_seconds = 300

[budget]
# Development integration allowance for four code-writing stages. Use the same
# limits and context settings for a paired single-agent comparison.
max_llm_calls = 80
max_total_tokens = 600000
max_tool_calls = 240
wall_seconds = 1800

[scheduling]
enabled = true
diagnosis_share = 0.15
features_share = 0.15
modeling_share = 0.45
auditing_share = 0.25
# Stop optional work before a role exhausts its own allocation.
finish_only_fraction = 0.8
finish_call_reserve = 2
finish_output_tokens = 1024
input_token_margin = 1024
# DeepSeek supports forced tool choice with thinking disabled (see llm above).
force_tool_choice = true
max_policy_corrections = 1
