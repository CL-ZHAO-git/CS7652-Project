# Scripted mock agents on the CRSP development panel: checks the data path end to end
# without an LLM or Docker. Build the panel first (configs/datasets/crsp_lc30_2017_2019.toml).
# For real agents, copy configs/anthropic.toml or configs/openai_compatible.toml and
# replace its [data] section with this one.
mode = "multi"
max_revisions = 1

[data]
source = "json"
path = "data/panels/crsp_lc30_2017_2019.json"
train_end = "2018-12-31"       # training: 2017-01-03 to 2018-12-31
validation_end = "2019-03-29"  # validation: 2019 Q1; test: 2019-04-01 to 2019-06-28
horizons = [1, 3, 5]

[llm]
backend = "mock"
max_output_tokens = 4096

[execution]
# Only trusted scripted fixtures use this mode. It is NOT a security sandbox.
mode = "local"
timeout_seconds = 60
evaluation_wall_seconds = 600

[budget]
max_llm_calls = 80
max_total_tokens = 100000
max_tool_calls = 150
wall_seconds = 900
